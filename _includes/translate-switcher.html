<!-- Translate the current page with Google Translate -->
<label class="page-translate-wrap" title="이 글을 다른 언어로 번역합니다">
  <select id="page-translate" class="page-translate" aria-label="이 글을 다른 언어로 번역">
    <option value="" selected>번역</option>
    <option value="en">English</option>
    <option value="ja">日本語</option>
    <option value="zh-CN">中文(简体)</option>
    <option value="zh-TW">中文(繁體)</option>
    <option value="vi">Tiếng Việt</option>
    <option value="es">Español</option>
  </select>
</label>
<style>
  .page-translate-wrap { display: inline-flex; align-items: center; margin: 0 0.15rem; }
  .page-translate {
    background: transparent;
    border: 0;
    color: inherit;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    max-width: 6.8rem;
    opacity: 0.75;
    padding: 0.25rem 0.35rem;
  }
  .page-translate:hover,
  .page-translate:focus { opacity: 1; outline: none; }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var sel = document.getElementById('page-translate');
    if (!sel) return;
    sel.addEventListener('change', function () {
      var tl = sel.value;
      if (!tl) return;
      var pageUrl = {{ page.url | absolute_url | jsonify }};
      location.href =
        'https://translate.google.com/translate?sl=ko&tl=' +
        encodeURIComponent(tl) +
        '&u=' +
        encodeURIComponent(pageUrl);
    });
  });
</script>
