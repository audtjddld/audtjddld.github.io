# Site settings
title: "404 dev"
tagline: "AI와 JVM 생태계, 백엔드 개발의 변화와 실무 기록"
description: >-
  AI·Java·Kotlin 생태계의 변화와 백엔드 개발을 다룹니다.
  기술 뉴스의 의미와 실무에 미치는 영향을 짚고, 개발 과정에서 얻은 지식을 기록합니다.
url: "https://404.is-a.dev"
baseurl: ""

lang: ko
timezone: Asia/Seoul

# Site language. Page translation is offered via the top-bar control,
# which sends the current URL through Google Translate.

github_username: audtjddld

# Theme
theme: jekyll-theme-chirpy

# Sidebar brand mark (not a personal photo)
avatar: /assets/img/404-brand.svg

# Social links (사이드바 하단)
social:
  name: audtjddld
  links:
    - https://github.com/audtjddld

# Build settings
port: 9999
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-include-cache
  - jekyll-archives

paginate: 15
paginate_path: "/page/:num/"

# Permalink
permalink: /posts/:title/

# Collections
collections:
  tabs:
    output: true
    sort_by: order

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# Google Search Console 인증
webmaster_verifications:
  google: # GSC 인증 코드를 여기에 입력 (content 속성값만)

# Google Analytics
analytics:
  google:
    id: "G-6R4EF0Q6XP"

# Chirpy 설정
toc: true

# 댓글 (필요시 활성화)
comments:
  provider: false

# Jekyll Archives
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - cleanup_posts.py
  - __pycache__/
